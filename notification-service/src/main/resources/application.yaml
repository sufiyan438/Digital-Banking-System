spring:
  application:
    name: notification-service

  kafka:
    bootstrap-servers: localhost:9092
#    bootstrap-servers: localhost:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.DelegatingByTypeSerializer
      properties:
        spring.kafka.value.serialization.bytetype: org.apache.kafka.common.serialization.ByteArraySerializer
        spring.kafka.value.serialization.default: org.springframework.kafka.support.serializer.JacksonJsonSerializer
    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
#      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
#      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring:
          deserializer:
            value:
              delegate:
                class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
          json:
            trusted:
              packages: "*"
            use:
              type:
                headers: false
            value:
              default:
                type: java.util.HashMap

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health, info